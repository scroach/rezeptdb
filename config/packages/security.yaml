security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt

    providers:
        doctrine_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            provider: doctrine_user_provider
            lazy: true
            entry_point: form_login
            http_basic: ~
            form_login:
                login_path: login
                check_path: login
            logout:
                path: /logout
                target: /
            remember_me:
                secret: '%kernel.secret%'
                secure: true
                httponly: true
                always_remember_me: true

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/test, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

parameters:
    locale: 'en'
    upload_directory: '%kernel.project_dir%/public/uploads/recipe-images'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    _instanceof:
        # services whose classes are instances of AbstractDOMParser will be tagged automatically
        App\Service\AbstractDOMParser:
            tags: ['app.dom_parser']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\RestController\:
        resource: '../src/RestController'
        tags: ['controller.service_arguments']

    App\Service\RecipeParserService:
        arguments:
            - !tagged_iterator app.dom_parser

    App\Twig\ImageExtension:
        arguments:
            $publicDir: '%kernel.project_dir%/public'
            $cacheDir: '%kernel.project_dir%/public/cache'
